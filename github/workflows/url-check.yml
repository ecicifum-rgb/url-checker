name: Hourly URL check

on:
  schedule:
    - cron: "7 * * * *"      # every hour
  workflow_dispatch:          # manual run button
  push:                       # also runs once right after you save this file
    paths: [".github/workflows/url-check.yml"]

permissions:
  contents: write            # lets the workflow save status.txt in your repo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check all URLs
        run: |
          python - <<'PY'
          import os, sys, time
          from concurrent.futures import ThreadPoolExecutor
          import requests

          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"}

          # CRITICAL: failure here fails the run and GitHub emails you
          HARD = [
            "https://freeimagesandillustrations.blogspot.com/",
            "https://freeimagesandillustrations.blogspot.com/p/support-us_12.html",
            "https://askarabinfo.blogspot.com/",
            "https://healthandfitness390.blogspot.com",
            "https://theindustrialedge.blogspot.com",
            "https://internationaltravel2.blogspot.com",
            "https://quranweb24hours.blogspot.com/p/blog-page.html",
            "https://quranweb24hours.blogspot.com",
            "https://quranweb24hours.blogspot.com/p/blog-page_23.html",
            "https://freeonlinetools24hours.blogspot.com",
          ]
          # WARNING ONLY: sites that often block bots
          SOFT = [
            "https://www.instagram.com/mohamed_hassan515/",
            "https://www.linkedin.com/in/mohamed-hassan-98647a181",
            "https://www.facebook.com/profile.php?id=100005199706910",
            "https://x.com/Mohassanart",
            "https://youtube.com/@illustrations2",
            "https://pin.it/1V3sRvmU3",
            "https://pxhere.com/en/photographer/767067?order=popular",
            "https://buymeacoffee.com/mohassan",
          ]
          U = "mohamed_hassan-5229782"
          SOFT += [f"https://pixabay.com/users/{U}/?tab=latest&pagi={n}" for n in range(2, 96)]
          for l in "de fr it es ru nl zh en ja ko tr ro pt hu fi id da cs sk vi".split():
              SOFT.append(f"https://pixabay.com/{l}/users/{U}/")
          T = "illustrations pixabay+business pixabay+idea pixabay+cartoon pixabay+flower pixabay+sport pixabay+medical pixabay+man pixabay+woman pixabay+silhouette pixabay+background pixabay+finance pixabay+socialmedia pixabay+seo pixabay+icon pixabay+design pixabay+content pixabay+physiology pixabay+islam pixabay+Ramadan pixabay+gym pixabay+people pixabay+learning pixabay+books pixabay+education pixabay+technology".split()
          SOFT += [f"https://www.google.com/search?q=mohamed_hassan+{t}" for t in T]

          items, seen = [], set()
          for u in HARD + SOFT:
              if u not in seen:
                  seen.add(u); items.append((u, u in HARD))

          def check(it):
              u, hard = it
              for i in range(3):
                  t = time.time()
                  try:
                      r = requests.get(u, headers=H, timeout=20)
                      ok = r.status_code < 400
                      note = "-> " + r.url if r.url.rstrip("/") != u.rstrip("/") else ""
                      res = (u, hard, r.status_code, ok, note)
                      if ok or r.status_code in (401, 403, 404, 429):
                          return res
                  except requests.RequestException as e:
                      res = (u, hard, None, False, type(e).__name__)
                  time.sleep(2)
              return res

          with ThreadPoolExecutor(4) as p:
              out = list(p.map(check, items))
          down = [r for r in out if r[1] and not r[3]]
          warn = [r for r in out if not r[1] and not r[3]]

          lines = ["# URL check",
                   f"Total {len(out)} | DOWN {len(down)} | Warnings {len(warn)} | OK {len(out)-len(down)-len(warn)}", ""]
          if down:
              lines += ["## DOWN", "| HTTP | URL | Note |", "|---|---|---|"]
              lines += [f"| {r[2] or '-'} | {r[0]} | {r[4]} |" for r in down]
          if warn:
              lines += ["", "## Warnings (bot-blocking sites)", "| HTTP | URL | Note |", "|---|---|---|"]
              lines += [f"| {r[2] or '-'} | {r[0]} | {r[4]} |" for r in warn]
          if not down and not warn:
              lines.append("All URLs OK.")
          rep = "\n".join(lines)
          print(rep)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(rep + "\n")
          stamp = time.strftime("%Y-%m-%d %H:%M UTC", time.gmtime())
          status = "STATUS: DOWN" if down else "STATUS: OK"
          body = f"{status}\nChecked: {stamp}\nTotal: {len(out)} | Down: {len(down)} | Warnings: {len(warn)}\n"
          if down:
              body += "Down:\n" + "\n".join(r[0] for r in down) + "\n"
          open("status.txt", "w").write(body)
          sys.exit(1 if down else 0)
          PY
      - name: Save status.txt to the repo
        if: always()
        run: |
          git config user.name "url-check-bot"
          git config user.email "bot@users.noreply.github.com"
          git add status.txt
          git commit -m "status update" || exit 0
          git push
